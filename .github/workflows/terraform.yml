name: terraform

# Runs on every pull request and every push to main, with no path filter:
# this job is a required status check, and a required check that is skipped
# blocks merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled. On main each commit gets its
  # own group, because GitHub keeps only one pending run per group and would
  # otherwise drop a queued main run when a newer merge arrives.
  group: terraform-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.64.0"
      - name: Format, validate and lint every stack
        run: scripts/terraform-check.sh
      - name: Security scan (checkov)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
