name: scheduled-checks

# Checks for dates that pass without any pull request to notice them. A
# failing scheduled run is emailed by GitHub to the person who last changed
# this schedule.
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-txt-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Fail 30 days before security.txt expires
        run: node --test test/security-txt.test.js
        env:
          SECURITY_TXT_STRICT: "true"
