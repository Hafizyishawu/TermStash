name: ci

# Pull requests are tested through pull_request; push covers main after merge.
# Running on every branch push as well would test each PR commit twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing in this pipeline writes to the repository.
permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled. On main each commit gets its
  # own group, because GitHub keeps only one pending run per group and would
  # otherwise drop a queued main run when a newer merge arrives.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Syntax check
        run: npm run check
      - name: Unit tests, including detector and namer accuracy on labeled corpora
        run: npm test
      - name: Build the deployable site
        # Also fails if the service worker precaches a file the site lacks.
        run: npm run build
      - name: Secret scan of shared packs
        # A credential in a pack reaches everyone who imports it. This fails
        # the build before that pack can be merged.
        run: npm run check-packs

  # Browser tests against the built site, served with its real headers. A
  # failing run keeps the report and traces so the failure can be replayed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Build the deployable site
        run: npm run build
      - name: Install the pinned test tools
        working-directory: e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for the pinned Playwright version
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Browser, offline and accessibility tests
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
