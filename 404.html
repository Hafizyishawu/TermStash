<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Its presence makes Cloudflare Pages answer unknown paths with a real
       404 instead of the app with a 200, which made scanners and researchers
       believe every probed path existed. Links are absolute because this page
       is served at whatever path was requested. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Not found · TermStash</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">
        <img src="/icon.svg" alt="" width="22" height="22">
        <span class="brand-name">TermStash</span>
      </div>
    </header>
    <main>
      <h1>Page not found</h1>
      <p class="muted">There is nothing at this address. TermStash is a single page; your saved commands are on it.</p>
      <p><a class="btn btn-primary" href="/">Open TermStash</a></p>
    </main>
  </div>
</body>
</html>
